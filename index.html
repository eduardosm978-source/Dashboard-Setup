<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Grupo Setup</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7f5;color:#173522}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{background:#fff;border:1px solid #dfe8e2;border-radius:16px;padding:26px;box-shadow:0 8px 28px rgba(20,60,35,.08)}
.box b{display:block;color:#0b7a3b;font-size:18px;margin-bottom:8px}
</style>
</head>
<body>
<div class="loading"><div class="box" id="status"><b>Grupo Setup</b>Carregando dashboard atualizado...</div></div>
<script>
(async()=>{
  const RAW='https://raw.githubusercontent.com/eduardosm978-source/Dashboard-Setup/main/';
  const VER='20260918-premiacao';
  async function getText(path){
    let last;
    for(let i=0;i<3;i++){
      try{
        const r=await fetch(RAW+path+'?v='+VER+'&t='+i,{cache:'no-store'});
        if(!r.ok)throw new Error('HTTP '+r.status+' em '+path);
        return await r.text();
      }catch(e){last=e;await new Promise(r=>setTimeout(r,350*(i+1)))}
    }
    throw last||new Error('Falha ao carregar '+path);
  }
  async function ungzipB64(b64){
    const bin=atob(b64.replace(/\s+/g,''));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    if('DecompressionStream' in window){
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).text();
    }
    if(!window.pako){
      await new Promise((ok,fail)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
        s.onload=ok;s.onerror=fail;document.head.appendChild(s)
      });
    }
    return pako.ungzip(bytes,{to:'string'});
  }
  try{
    const [p1,p2,p3,metaB64]=await Promise.all([
      getText('_dash/part1.txt'),
      getText('_dash/part2.txt'),
      getText('_dash/part3.txt'),
      getText('_dash/structure_meta.b64')
    ]);
    let html=await ungzipB64((p1+p2+p3).replace(/\s+/g,''));
    const newStructure=await ungzipB64(metaB64);
    const a=html.indexOf('const STRUCTURE=');
    const b=html.indexOf('const TEAM_MAP=',a);
    if(a<0||b<=a)throw new Error('Estrutura do dashboard não localizada');
    html=html.slice(0,a)+newStructure+'\n'+html.slice(b);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('status').innerHTML='<b>Não foi possível carregar o dashboard</b>'+String(e.message||e);
  }
})();
</script>
</body>
</html>
