<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Grupo Setup</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7f5;color:#173522}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{background:#fff;border:1px solid #dfe8e2;border-radius:16px;padding:26px;box-shadow:0 8px 28px rgba(20,60,35,.08);max-width:760px}.box b{display:block;color:#0b7a3b;font-size:18px;margin-bottom:8px}.small{font-size:12px;color:#69756d;margin-top:8px}
</style>
</head>
<body>
<div class="loading"><div class="box" id="status"><b>Grupo Setup</b>Carregando dashboard atualizado...<div class="small">Aguarde alguns segundos.</div></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const base='https://raw.githubusercontent.com/eduardosm978-source/Dashboard-Setup/main/';
    const version='20260918-fix-loader';
    const files=['_dash/part1.txt','_dash/part2.txt','_dash/part3.txt'];
    const parts=[];
    for(const f of files){
      let txt='',ok=false,lastErr='';
      for(let i=1;i<=3;i++){
        try{
          const r=await fetch(base+f+'?v='+version+'-'+Date.now(),{cache:'no-store'});
          if(!r.ok) throw new Error('HTTP '+r.status);
          txt=await r.text(); ok=true; break;
        }catch(e){lastErr=String(e.message||e); await new Promise(res=>setTimeout(res,350*i));}
      }
      if(!ok) throw new Error('Falha ao carregar '+f+' — '+lastErr);
      parts.push(txt.trim());
    }
    let b64=parts.join('').replace(/[^A-Za-z0-9+/=]/g,'');
    while(b64.length%4)b64+='=';
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    let html;
    if('DecompressionStream' in window){
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      html=await new Response(stream).text();
    }else{
      await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)});
      html=pako.ungzip(bytes,{to:'string'});
    }
    document.open();document.write(html);document.close();
  }catch(e){
    status.innerHTML='<b>Não foi possível carregar o dashboard</b>'+String(e.message||e)+'<div class="small">Feche esta aba e abra novamente. Se persistir, me envie este print.</div>';
  }
})();
</script>
</body>
</html>
