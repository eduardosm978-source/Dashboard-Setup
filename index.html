<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Grupo Setup</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7f5;color:#173522}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{background:#fff;border:1px solid #dfe8e2;border-radius:16px;padding:26px;box-shadow:0 8px 28px rgba(20,60,35,.08);max-width:760px}.box b{display:block;color:#0b7a3b;font-size:18px;margin-bottom:8px}.muted{font-size:12px;color:#69756d;margin-top:10px}.err{color:#a42a21;font-weight:800;white-space:pre-wrap;text-align:left;margin-top:10px}
</style>
</head>
<body>
<div class="loading"><div class="box" id="status"><b>Grupo Setup</b>Carregando dashboard atualizado...</div></div>
<script>
const RAW='https://raw.githubusercontent.com/eduardosm978-source/Dashboard-Setup/main';
const VER='20260919-final-no-atob-cache-clear';
const FILES=['_dash/part1.txt','_dash/part2.txt','_dash/part3.txt','_dash/part4.txt'];
const META='_dash/structure_meta.b64';
const S=document.getElementById('status');
function msg(t){S.innerHTML=t}
async function limpaCache(){try{if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){console.warn('cache clear',e)}}
async function get(p){let last='';for(let i=1;i<=5;i++){try{const r=await fetch(RAW+'/'+p+'?v='+VER+'&t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.text();last='HTTP '+r.status}catch(e){last=e.message||String(e)}await new Promise(ok=>setTimeout(ok,350*i))}throw new Error('Falha ao carregar '+p+' — '+last)}
function cleanB64(s){s=String(s||'').replace(/[^A-Za-z0-9+/=]/g,'').replace(/=+$/,'');return s+'='.repeat((4-s.length%4)%4)}
function b64ToBytes(label,input){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';let s=cleanB64(input),out=[],buf=0,bits=0,valid=0;for(const ch of s){if(ch==='=')break;const n=chars.indexOf(ch);if(n<0)continue;valid++;buf=(buf<<6)|n;bits+=6;if(bits>=8){bits-=8;out.push((buf>>bits)&255)}}if(out.length<20||valid<20)throw new Error('Base64 inválido em '+label);return new Uint8Array(out)}
async function loadPako(){if(window.pako)return;let erro='';for(const src of ['https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js','https://unpkg.com/pako@2.1.0/dist/pako.min.js']){try{await new Promise((ok,fail)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error('falha '+src));document.head.appendChild(s)});if(window.pako)return}catch(e){erro=e.message||String(e)}}throw new Error('Não carregou biblioteca de descompactação: '+erro)}
async function ungzip(label,b64){const bytes=b64ToBytes(label,b64);try{await loadPako();return window.pako.ungzip(bytes,{to:'string'})}catch(e){throw new Error('Falha ao descompactar '+label+' — '+(e.message||e))}}
function labels(h){return h.replace(/>Meta mês</g,'>Meta premiação mês<').replace(/>Meta dia</g,'>Meta premiação dia<').replace(/>META MÊS DA EQUIPE</g,'>META PREMIAÇÃO DA EQUIPE<').replaceAll('Meta das equipes selecionadas','Meta premiação das equipes selecionadas').replaceAll('Meta diária das equipes selecionadas','Meta premiação diária das equipes selecionadas').replaceAll('Meta mensal fixa da equipe selecionada','Meta premiação mensal da equipe selecionada').replaceAll('Meta faturamento dia','Meta premiação dia')}
function applyMeta(h,txt){const p=JSON.parse(txt);const st=Array.isArray(p)?p:(p.structure||[]);const des=Array.isArray(p)?[]:(p.desmobilized||p.desmobilizedTeams||[]);h=h.replace(/const STRUCTURE=\[.*?\];/s,'let STRUCTURE='+JSON.stringify(st)+';');h=h.replace(/const DESMOBILIZED_TEAMS=new Set\(\[.*?\]\);/s,'let DESMOBILIZED_TEAMS=new Set('+JSON.stringify(des)+');');h=h.replace('const TEAM_MAP=new Map','let TEAM_MAP=new Map');h=h.replace('const STRUCT_COORDS=','let STRUCT_COORDS=');h=h.replace(/function base64ParaBytes\(b64\)\{[\s\S]*?return bytes;\n\}/,'function base64ParaBytes(b64){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";let s=String(b64||"").replace(/[^A-Za-z0-9+/=]/g,"").replace(/=+$/,"");let out=[],buf=0,bits=0;for(const ch of s){if(ch==="=")break;const n=chars.indexOf(ch);if(n<0)continue;buf=(buf<<6)|n;bits+=6;if(bits>=8){bits-=8;out.push((buf>>bits)&255)}}return new Uint8Array(out);\n}');return h}
function injectHiddenBaseResumo(h){const code=`<script>(function(){try{var btn=document.createElement('button');btn.textContent='BR';btn.title='Carregar BASE_RESUMO';btn.style.cssText='position:fixed;right:8px;bottom:8px;z-index:999999;width:36px;height:28px;border-radius:8px;background:#0b7a3b;color:#fff;border:0;opacity:.16;font-weight:900';btn.onmouseenter=function(){btn.style.opacity='1'};btn.onmouseleave=function(){btn.style.opacity='.16'};var inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv';inp.style.display='none';document.body.appendChild(btn);document.body.appendChild(inp);btn.onclick=function(){inp.click()};function nk(s){return String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim().toUpperCase().replace(/\\s+/g,' ')}function num(v){if(v==null||v==='')return 0;var s=String(v).replace('R$','').replace(/\\s/g,'');if(s.indexOf(',')>-1&&s.indexOf('.')>-1)s=s.replace(/\\./g,'').replace(',','.');else s=s.replace(',','.');var n=Number(s);return isFinite(n)?n:0}function val(r,n){var ks=Object.keys(r);for(var i=0;i<ks.length;i++){if(nk(ks[i])===n)return r[ks[i]]}return ''}function build(rows){var st=[],des=[],seen={};rows.forEach(function(r){var eq=String(val(r,'PREFIXOS_SETUP')||val(r,'EQUIPE')||'').trim().toUpperCase();if(!eq||seen[eq])return;seen[eq]=1;var mob=nk(val(r,'MOBILIZACAO'));if(mob&&mob!=='MOBILIZADA'){des.push(eq);return}var proc=String(val(r,'PROCESSO')||'').trim().toUpperCase();var meta=num(val(r,'META PREMIACAO'));var dias=num(val(r,'DIA TRAB CT'))||(proc.indexOf('PLANT')>-1?30:22);st.push({processo:proc,coordenador:String(val(r,'GERENTES')||val(r,'COORDENADOR')||'').trim().toUpperCase(),supervisor:String(val(r,'SUPERVISOR')||'').trim().toUpperCase(),fiscal:String(val(r,'FISCAL')||'').trim().toUpperCase(),equipe:eq,turno:String(val(r,'TURNO')||'').trim().toUpperCase(),polo:String(val(r,'POLO')||'').trim().toUpperCase(),regional:String(val(r,'REGIONAL')||'').trim().toUpperCase(),mobilizacao:'MOBILIZADA',metaMes:meta,metaDia:dias?meta/dias:0,metaPremiacao:meta,diaTrabCt:dias,metaDiaOper:num(val(r,'META DIA')),metaMesOper:num(val(r,'META MES')),qtdEqp:num(val(r,'QTD EQP'))});});return{st:st,des:des}}inp.onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var wb=XLSX.read(fr.result,{type:'array'});var ws=wb.Sheets['Base_resumo']||wb.Sheets['BASE_RESUMO']||wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{defval:''});var b=build(rows);STRUCTURE=b.st;DESMOBILIZED_TEAMS=new Set(b.des);TEAM_MAP=new Map(STRUCTURE.map(function(x){return[upKey(x.equipe),x]}));if(typeof updateFilters==='function')updateFilters();if(typeof normalizeRows==='function'&&window.raw&&raw.length)normalizeRows();if(typeof render==='function')render();alert('BASE_RESUMO carregada: '+b.st.length+' equipes mobilizadas.')}catch(err){alert('Erro ao carregar BASE_RESUMO: '+(err.message||err));}};fr.readAsArrayBuffer(f)}}catch(e){console.warn(e)}})();<\/script>`;return h.replace('</body>',code+'</body>')}
(async()=>{try{await limpaCache();msg('<b>Grupo Setup</b>Baixando dashboard limpo...<div class="muted">Versão sem atob, com cache limpo e BASE_RESUMO(7).</div>');const parts=await Promise.all(FILES.map(get));let html=await ungzip('dashboard',parts.join(''));const meta=await ungzip('metas premiação',await get(META));html=injectHiddenBaseResumo(labels(applyMeta(html,meta)));document.open();document.write(html);document.close()}catch(e){msg('<b>Não foi possível carregar o dashboard</b><div class="err">'+String(e.message||e)+'</div><div class="muted">Abra com: ?v=final-no-atob-cache-clear. Se persistir, copie este erro.</div>')}})();
</script>
</body>
</html>
