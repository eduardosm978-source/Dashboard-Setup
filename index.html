function renderCards(team){let st=currentStructure(),meta=st.reduce((a,x)=>a+(+x.metaMes||0),0),real=team.reduce((a,x)=>a+x.real,0),prod=team.reduce((a,x)=>a+x.prod,0),imp=team.reduce((a,x)=>a+x.imp,0),pct=meta?real/meta*100:0;$('cards').innerHTML=[['Equipes mobilizadas',int(st.length),'na seleção'],['Meta premiação mês',brl(meta),'somente mobilizadas'],['Faturamento realizado',brl(real),'planilha carregada'],['% meta atingida',(pct||0).toFixed(1)+'%',pct>=100?'meta batida':'andamento'],['Produtivos',int(prod),'executados'],['Improdutivos',int(imp),'sem faturamento'],['Lideranças',int(uniq(st.map(x=>x.supervisor)).length),'supervisores'],['Desmobilizadas fora',int(DESMOBILIZED_TEAMS.size),'não entram no cálculo']].map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="h">${c[2]}</div></div>`).join('')}
function renderTeam(team){lastTeam=team;$('teamTable').innerHTML='<thead><tr><th>Equipe</th><th>Processo</th><th>Supervisor</th><th>Fiscal</th><th class="right">Meta premiação</th><th class="right">Realizado</th><th class="right">%</th><th class="right">Falta</th><th class="right">Prod.</th><th class="right">Improd.</th></tr></thead><tbody>'+team.map(x=>`<tr><td>${x.equipe}</td><td>${x.processo}</td><td>${x.supervisor}</td><td>${x.fiscal}</td><td class="right">${brl(x.metaMes)}</td><td class="right">${brl(x.real)}</td><td class="right ${x.pct>=100?'ok':x.pct>=80?'warn':'bad'}">${x.pct.toFixed(1)}%</td><td class="right">${brl(x.falta)}</td><td class="right">${int(x.prod)}</td><td class="right">${int(x.imp)}</td></tr>`).join('')+'</tbody>'}
function renderLead(team){let m=new Map();for(const x of team){let k=x.supervisor+'|'+x.fiscal;if(!m.has(k))m.set(k,{supervisor:x.supervisor,fiscal:x.fiscal,meta:0,real:0,e:0});let o=m.get(k);o.meta+=x.metaMes;o.real+=x.real;o.e++}let arr=[...m.values()].map(x=>({...x,pct:x.meta?x.real/x.meta*100:0})).sort((a,b)=>b.real-a.real);$('leadTable').innerHTML='<thead><tr><th>Supervisor</th><th>Fiscal</th><th class="right">Equipes</th><th class="right">Meta</th><th class="right">Realizado</th><th class="right">%</th></tr></thead><tbody>'+arr.map(x=>`<tr><td>${x.supervisor}</td><td>${x.fiscal}</td><td class="right">${int(x.e)}</td><td class="right">${brl(x.meta)}</td><td class="right">${brl(x.real)}</td><td class="right ${x.pct>=100?'ok':x.pct>=80?'warn':'bad'}">${x.pct.toFixed(1)}%</td></tr>`).join('')+'</tbody>'}
function renderStruct(){let st=currentStructure().slice().sort((a,b)=>a.coordenador.localeCompare(b.coordenador,'pt-BR')||a.supervisor.localeCompare(b.supervisor,'pt-BR')||a.equipe.localeCompare(b.equipe,'pt-BR'));$('structTable').innerHTML='<thead><tr><th>Equipe</th><th>Coordenador</th><th>Supervisor</th><th>Fiscal</th><th>Processo</th><th>Turno</th><th class="right">Meta premiação</th><th class="right">Meta dia</th></tr></thead><tbody>'+st.map(x=>`<tr><td>${x.equipe}</td><td>${x.coordenador}</td><td>${x.supervisor}</td><td>${x.fiscal}</td><td>${x.processo}</td><td>${x.turno}</td><td class="right">${brl(x.metaMes)}</td><td class="right">${brl(x.metaDia)}</td></tr>`).join('')+'</tbody>'}
function renderChart(team){let m=new Map();for(const x of team){let o=m.get(x.processo)||{meta:0,real:0};o.meta+=x.metaMes;o.real+=x.real;m.set(x.processo,o)}let labels=[...m.keys()],data=labels.map(k=>m.get(k).real),meta=labels.map(k=>m.get(k).meta);if(chart)chart.destroy();chart=new Chart($('chart'),{type:'bar',data:{labels,datasets:[{label:'Realizado',data},{label:'Meta premiação',data:meta}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>Number(v).toLocaleString('pt-BR')}}}}})}
function render(){fillFilters();let team=aggregate();renderCards(team);renderTeam(team);renderLead(team);renderStruct();renderChart(team)}
async function loadEmbedded(){try{let payload=JSON.parse(await ungzipB64(META_B64));STRUCTURE=payload.structure||[];DESMOBILIZED_TEAMS=new Set(payload.desmobilized||[]);$('baseStatus').textContent=`BASE_RESUMO(7) carregada: ${STRUCTURE.length} mobilizadas`;render()}catch(e){console.error(e);$('baseStatus').textContent='Erro na BASE_RESUMO embutida';msg('Erro ao abrir BASE_RESUMO embutida: '+(e.message||e),'err')}}
function buildBaseFromSheet(rows2){let hi=0;for(let i=0;i<Math.min(rows2.length,30);i++){let ks=(rows2[i]||[]).map(key);if((ks.includes('PREFIXOS_SETUP')||ks.includes('EQUIPE'))&&(ks.includes('META PREMIACAO')||ks.includes('PROCESSO'))){hi=i;break}}let h=(rows2[hi]||[]).map(key),idx={};h.forEach((x,i)=>idx[x]=i);const get=(r,n)=>{for(const x of n){let j=idx[key(x)];if(j!=null)return r[j]}return ''};let st=[],des=[],seen=new Set();for(const r of rows2.slice(hi+1)){let equipe=norm(get(r,['Prefixos_Setup','EQUIPE']));if(!equipe)continue;let mob=key(get(r,['Mobilização','Mobilizacao']));if(mob&&mob!=='MOBILIZADA'){des.push(equipe);continue}if(seen.has(equipe))continue;seen.add(equipe);let processo=norm(get(r,['PROCESSO'])),meta=num(get(r,['META PREMIAÇÃO','META PREMIACAO']));let dias=num(get(r,['DIA TRAB CT','DIAS TRAB CT','DIA TRAB']));if(!dias)dias=key(processo).includes('PLANT')?30:22;st.push({processo,coordenador:norm(get(r,['GERENTES','COORDENADOR','GERENTE'])),supervisor:norm(get(r,['SUPERVISOR'])),fiscal:norm(get(r,['FISCAL'])),equipe,turno:norm(get(r,['TURNO'])),polo:norm(get(r,['POLO'])),regional:norm(get(r,['REGIONAL'])),mobilizacao:mob||'MOBILIZADA',metaMes:meta,metaDia:dias?meta/dias:0,metaPremiacao:meta,diaTrabCt:dias,metaDiaOper:num(get(r,['META DIA'])),metaMesOper:num(get(r,['META MÊS','META MES'])),qtdEqp:num(get(r,['QTD EQP']))})}return{st,des}}
async function loadBaseFile(file){let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),name=wb.SheetNames.find(n=>key(n).includes('BASE'))||wb.SheetNames[0],arr=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:''}),b=buildBaseFromSheet(arr);if(!b.st.length)throw new Error('Nenhuma equipe mobilizada encontrada');STRUCTURE=b.st;DESMOBILIZED_TEAMS=new Set(b.des);$('baseStatus').textContent=`BASE_RESUMO manual: ${STRUCTURE.length} mobilizadas`;render();msg(`BASE_RESUMO aplicada: ${STRUCTURE.length} equipes mobilizadas | Meta ${brl(STRUCTURE.reduce((a,x)=>a+x.metaMes,0))}`)}
async function loadFat(file){let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];rawRows=XLSX.utils.sheet_to_json(ws,{defval:''});rows=prepareRows(rawRows);render();msg(`Planilha de faturamento carregada: ${int(rows.length)} registros válidos.`)}
['coord','sup','fis','proc','turno','eqp'].forEach(id=>$(id).onchange=render);$('clear').onclick=()=>{['coord','sup','fis','proc','turno','eqp'].forEach(id=>$(id).value='');render()};$('fatFile').onchange=e=>e.target.files[0]&&loadFat(e.target.files[0]).catch(err=>msg('Erro ao carregar faturamento: '+err.message,'err'));$('baseFileVisible').onchange=e=>e.target.files[0]&&loadBaseFile(e.target.files[0]).catch(err=>msg('Erro ao carregar BASE_RESUMO: '+err.message,'err'));$('brHidden').onclick=()=>$('brFile').click();$('brFile').onchange=e=>e.target.files[0]&&loadBaseFile(e.target.files[0]).catch(err=>msg('Erro ao carregar BASE_RESUMO: '+err.message,'err'));$('exportCsv').onclick=()=>{let csv='Equipe;Processo;Supervisor;Fiscal;Meta;Realizado;Percentual;Falta;Produtivos;Improdutivos\n'+lastTeam.map(x=>[x.equipe,x.processo,x.supervisor,x.fiscal,x.metaMes,x.real,x.pct.toFixed(2),x.falta,x.prod,x.imp].join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ranking_setup.csv';a.click()};
loadEmbedded();
