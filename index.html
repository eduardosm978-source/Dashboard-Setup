async function gunzipB64(b64){
 const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
 if('DecompressionStream' in window){const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text();}
 await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)});
 return pako.ungzip(bytes,{to:'string'});
}
async function fetchPart(u){
 for(let i=0;i<3;i++){
  try{const r=await fetch(u+'?v='+VER+'&t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.text();}catch(e){}
  await new Promise(r=>setTimeout(r,500));
 }
 throw new Error('Falha ao carregar '+u);
}

  const struct=await gunzipB64(SG),des=await gunzipB64(DG);
  html=html.replace(/const STRUCTURE=\[.*?\];
const DESMOBILIZED_TEAMS=/s,'const STRUCTURE='+struct+';\nconst DESMOBILIZED_TEAMS=');
  html=html.replace(/const DESMOBILIZED_TEAMS=new Set\(\[.*?\]\);/s,'const DESMOBILIZED_TEAMS=new Set('+des+');');
  html=html.replace(/>Meta mês</g,'>Meta premiação mês<').replace(/>Meta dia</g,'>Meta premiação dia<').replace(/>META MÊS DA EQUIPE</g,'>META PREMIAÇÃO DA EQUIPE<').replaceAll('Meta das equipes selecionadas','Meta premiação das equipes selecionadas').replaceAll('Meta diária das equipes selecionadas','Meta premiação diária das equipes selecionadas').replaceAll('Meta mensal fixa da equipe selecionada','Meta premiação mensal da equipe selecionada').replaceAll('Meta faturamento dia','Meta premiação dia');
  document.open();document.write(html);document.close();
