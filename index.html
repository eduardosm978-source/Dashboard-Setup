<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Grupo Setup</title>
<style>body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7f5;color:#173522}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{background:#fff;border:1px solid #dfe8e2;border-radius:16px;padding:26px;box-shadow:0 8px 28px rgba(20,60,35,.08)}.box b{display:block;color:#0b7a3b;font-size:18px;margin-bottom:8px}</style>
</head>
<body>
<div class="loading"><div class="box" id="status"><b>Grupo Setup</b>Carregando dashboard atualizado...</div></div>
<script>
(async()=>{
  try{
    const files=['_dash/part1.txt','_dash/part2.txt','_dash/part3.txt'];
    const parts=await Promise.all(files.map(async u=>{
      const r=await fetch(u+'?v=20260917-ups',{cache:'no-store'});
      if(!r.ok)throw new Error('Falha ao carregar '+u);
      return r.text();
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    let html;
    if('DecompressionStream' in window){
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      html=await new Response(stream).text();
    }else{
      await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)});
      html=pako.ungzip(bytes,{to:'string'});
    }
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('status').innerHTML='<b>Não foi possível carregar o dashboard</b>'+String(e.message||e);
  }
})();
</script>
</body>
</html>
