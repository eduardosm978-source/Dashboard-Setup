<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Grupo Setup</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7f5;color:#173522}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{background:#fff;border:1px solid #dfe8e2;border-radius:16px;padding:26px;box-shadow:0 8px 28px rgba(20,60,35,.08);max-width:760px}.box b{display:block;color:#0b7a3b;font-size:18px;margin-bottom:8px}.muted{font-size:12px;color:#69756d;margin-top:10px}
</style>
</head>
<body>
<div class="loading"><div class="box" id="status"><b>Grupo Setup</b>Carregando dashboard atualizado...</div></div>
<script>
const RAW='https://raw.githubusercontent.com/eduardosm978-source/Dashboard-Setup/main';
const VER='20260918-base7-direct-part4';
const FILES=['_dash/part1.txt','_dash/part2.txt','_dash/part3.txt','_dash/part4.txt'];
const META='_dash/structure_meta.b64';
const S=document.getElementById('status');
function msg(t){S.innerHTML=t}
async function get(p){let last='';for(let i=1;i<=4;i++){try{const r=await fetch(RAW+'/'+p+'?v='+VER+'&t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.text();last='HTTP '+r.status}catch(e){last=e.message||String(e)}await new Promise(ok=>setTimeout(ok,300*i))}throw new Error('Falha ao carregar '+p+' — '+last)}
function clean(s){s=String(s||'').replace(/[^A-Za-z0-9+/=]/g,'').replace(/=+$/,'');return s+'='.repeat((4-s.length%4)%4)}
function b64bytes(label,input){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';let s=clean(input),out=[],buf=0,bits=0,v=0;for(let ch of s){if(ch==='=')break;let n=c.indexOf(ch);if(n<0)continue;buf=(buf<<6)|n;bits+=6;v++;if(bits>=8){bits-=8;out.push((buf>>bits)&255)}}if(out.length<20||v<20)throw new Error('Base64 inválido em '+label);return new Uint8Array(out)}
async function ungzip(label,b64){const bytes=b64bytes(label,b64);try{if('DecompressionStream' in window){const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}if(!window.pako){await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)})}return pako.ungzip(bytes,{to:'string'})}catch(e){throw new Error('Falha ao descompactar '+label+' — '+(e.message||e))}}
function labels(h){return h.replace(/>Meta mês</g,'>Meta premiação mês<').replace(/>Meta dia</g,'>Meta premiação dia<').replace(/>META MÊS DA EQUIPE</g,'>META PREMIAÇÃO DA EQUIPE<').replaceAll('Meta das equipes selecionadas','Meta premiação das equipes selecionadas').replaceAll('Meta diária das equipes selecionadas','Meta premiação diária das equipes selecionadas').replaceAll('Meta mensal fixa da equipe selecionada','Meta premiação mensal da equipe selecionada').replaceAll('Meta faturamento dia','Meta premiação dia')}
function applyMeta(h,txt){let p=JSON.parse(txt);let st=Array.isArray(p)?p:(p.structure||[]),des=Array.isArray(p)?[]:(p.desmobilized||p.desmobilizedTeams||[]);h=h.replace(/const STRUCTURE=\[.*?\];/s,'const STRUCTURE='+JSON.stringify(st)+';');h=h.replace(/const DESMOBILIZED_TEAMS=new Set\(\[.*?\]\);/s,'const DESMOBILIZED_TEAMS=new Set('+JSON.stringify(des)+');');return h}
(async()=>{try{msg('<b>Grupo Setup</b>Baixando dashboard...<div class="muted">Carregamento corrigido com a parte 4 e sem erro de codificação.</div>');let parts=await Promise.all(FILES.map(get));let html=await ungzip('dashboard',parts.join(''));let meta=await ungzip('metas premiação',await get(META));html=labels(applyMeta(html,meta));document.open();document.write(html);document.close()}catch(e){msg('<b>Não foi possível carregar o dashboard</b>'+String(e.message||e)+'<div class="muted">Feche a aba e abra novamente com ?v=base7fix2. Se persistir, envie este erro.</div>')}})();
</script>
</body>
</html>
